<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Танки в лабиринте</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;text-align:center;font-family:Arial}
h2{color:#00ff99;margin:12px}
#info{margin:8px;font-size:18px}
canvas{background:#18251b;border:3px solid #00ff99;max-width:95vw;touch-action:none}
button{background:#00cc88;border:0;border-radius:8px;padding:12px 18px;margin:4px;font-size:18px;font-weight:bold}
.controls{margin:10px auto;max-width:300px;display:grid;grid-template-columns:repeat(3,1fr)}
.controls button{padding:15px}
</style>
</head>
<body>
<h2>🎮 ТАНКИ В ЛАБИРИНТЕ</h2>
<div id="info">⭐ Ұпай: <span id="score">0</span> | ❤️ Өмір: <span id="lives">3</span></div>
<canvas id="game" width="480" height="480"></canvas>
<div class="controls">
<div></div><button onclick="move(0,-1)">⬆️</button><div></div>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="shoot()">🔥</button>
<button onclick="move(1,0)">➡️</button>
<div></div><button onclick="move(0,1)">⬇️</button><div></div>
</div>
<button onclick="restart()">🔄 Қайта бастау</button>
<p>Пернетақта: WASD / бағыттар · SPACE — ату</p>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const N=15, S=32;
let map, player, enemies, bullets, score, lives, over, lastShot;

function restart(){
 map=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>
  x===0||y===0||x===N-1||y===N-1||
  (Math.random()<0.19 && !(x<4&&y>N-5) && !(x>N-5&&y<4))?1:0
 ));
 // Ойын жолдары
 for(let i=1;i<N-1;i++){map[1][i]=0;map[i][1]=0;map[N-2][i]=0;map[i][N-2]=0}
 player={x:1,y:N-2,dir:{x:1,y:0}};
 enemies=[{x:N-2,y:1,dir:{x:-1,y:0}},{x:N-2,y:N-2,dir:{x:-1,y:0}}];
 bullets=[];score=0;lives=3;over=false;lastShot=0;
 draw();
}
function free(x,y){
 return x>=0&&y>=0&&x<N&&y<N&&map[y][x]===0;
}
function move(dx,dy){
 if(over)return;
 player.dir={x:dx,y:dy};
 let x=player.x+dx,y=player.y+dy;
 if(free(x,y)&&!enemies.some(e=>e.x===x&&e.y===y)){
  player.x=x;player.y=y;
 }
 draw();
}
function shoot(){
 if(over)return;
 let {x:dx,y:dy}=player.dir;
 bullets.push({x:player.x+dx,y:player.y+dy,dx,dy,enemy:false});
 draw();
}
function enemyTurn(){
 if(over)return;
 for(const e of enemies){
  let dx=player.x-e.x,dy=player.y-e.y;
  if(Math.random()<0.65){
   if(Math.abs(dx)>Math.abs(dy))e.dir={x:Math.sign(dx),y:0};
   else e.dir={x:0,y:Math.sign(dy)};
  }else if(Math.random()<0.5)e.dir={x:1,y:0};
  else e.dir={x:0,y:1};
  let x=e.x+e.dir.x,y=e.y+e.dir.y;
  if(free(x,y)&&!enemies.some(o=>o!==e&&o.x===x&&o.y===y)&&!(x===player.x&&y===player.y)){
   e.x=x;e.y=y;
  }
  if(e.x===player.x&&e.y===player.y)damage();
  if(Math.random()<0.35){
   bullets.push({x:e.x+e.dir.x,y:e.y+e.dir.y,dx:e.dir.x,dy:e.dir.y,enemy:true});
  }
 }
 draw();
}
function damage(){
 lives--;
 if(lives<=0)over=true;
 else {player.x=1;player.y=N-2;}
}
function update(){
 if(!over){
  for(const b of bullets){
   b.x+=b.dx;b.y+=b.dy;
   if(!free(b.x,b.y)){b.dead=true;continue}
   if(b.enemy){
    if(b.x===player.x&&b.y===player.y){b.dead=true;damage();}
   }else{
    let i=enemies.findIndex(e=>e.x===b.x&&e.y===b.y);
    if(i>=0){enemies.splice(i,1);b.dead=true;score+=100;}
   }
  }
  bullets=bullets.filter(b=>!b.dead);
  if(enemies.length===0){
   enemies.push({x:N-2,y:1,dir:{x:-1,y:0}},{x:N-2,y:N-2,dir:{x:-1,y:0}});
   score+=200;
  }
 }
 draw();
}
function draw(){
 ctx.clearRect(0,0,480,480);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  ctx.fillStyle=map[y][x]?'#687783':'#1b3026';
  ctx.fillRect(x*S,y*S,S-1,S-1);
  if(map[y][x]){
   ctx.fillStyle='#8997a2';
   ctx.fillRect(x*S+3,y*S+3,S-7,S-7);
  }
 }
 function tank(t,color){
  ctx.save();ctx.translate(t.x*S+S/2,t.y*S+S/2);
  let d=t.dir||{x:1,y:0};ctx.rotate(Math.atan2(d.y,d.x));
  ctx.fillStyle=color;ctx.fillRect(-11,-11,22,22);
  ctx.fillStyle='#d7e5df';ctx.fillRect(0,-4,15,8);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
 tank(player,'#35f28b');
 enemies.forEach(e=>tank(e,'#ff4b57'));
 bullets.forEach(b=>{
  ctx.fillStyle=b.enemy?'#ffba42':'#65efff';
  ctx.beginPath();ctx.arc(b.x*S+16,b.y*S+16,5,0,Math.PI*2);ctx.fill();
 });
 document.getElementById('score').textContent=score;
 document.getElementById('lives').textContent=lives;
 if(over){
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,480,480);
  ctx.fillStyle='#ff5267';ctx.textAlign='center';ctx.font='bold 34px Arial';
  ctx.fillText('ОЙЫН БІТТІ!',240,220);
  ctx.fillStyle='white';ctx.font='20px Arial';
  ctx.fillText('Қайта бастау батырмасын бас',240,265);
 }
}
document.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowUp'||e.key==='w')move(0,-1);
 if(e.key==='ArrowDown'||e.key==='s')move(0,1);
 if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);
 if(e.key==='ArrowRight'||e.key==='d')move(1,0);
 if(e.key===' ')shoot();
});
setInterval(enemyTurn,650);
setInterval(update,180);
restart();
</script>
</body>
</html>
